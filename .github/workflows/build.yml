name: Build UDM-Pro Ubuntu image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    # Native arm64 runner: no QEMU needed, fast chroot.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            parted e2fsprogs xz-utils curl qemu-user-static

      - name: Build image
        run: sudo ./build.sh

      - name: Fix artifact permissions
        run: sudo chown -R "$(id -u):$(id -g)" out/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: udm-ubuntu-image
          path: |
            out/*.img.xz
            out/*.sha256
            out/ROOT_PASSWORD.txt
          if-no-files-found: error

      - name: Attach to release (on tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.img.xz
            out/*.sha256
            out/ROOT_PASSWORD.txt
